[project]
name = "gotag"
version = "0.1.0"
description = "GoTag x402 vehicle payment network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "py-algorand-sdk>=2.7.0",
    "algokit-utils>=4.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
]

[tool.setuptools]
packages = ["backend", "api"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
